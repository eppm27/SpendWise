spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/spendwise}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.servlet.context-path=/api

spring.web.resources.static-locations=classpath:/static/,file:uploads/

gemini.apiKey=${GEMINI_API_KEY:}
gemini.model=gemini-2.5-flash
gemini.timeoutMillis=80000

unirate.api-key=${UNIRATE_API_KEY:}
server.port=${PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/api
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=30m
app.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
